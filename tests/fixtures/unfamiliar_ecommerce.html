<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boutique Artisan Goods</title>
</head>
<body>
    <div id="artisan-showcase">
        <section class="artisan-unit" data-item-id="ART-001">
            <div class="visual-wrap">
                <img src="/crafts/ceramic-mug.jpg" alt="Artisan Mug">
            </div>
            <div class="unit-body">
                <span class="product-title-text">Handmade Ceramic Coffee Mug</span>
                <div class="pricing-tier">
                    <span class="active-val">₹1,850</span>

                <a href="/crafts/handmade-ceramic-mug" class="view-btn">View</a>
            </div>
        </section>
        <section class="artisan-unit" data-item-id="ART-002">
            <div class="visual-wrap">
                <img src="/crafts/woven-blanket.jpg" alt="Artisan Blanket">
            </div>

                <span class="product-title-text">Pure Wool Woven Throw Blanket</span>
                <div class="pricing-tier">
                    <span class="active-val">₹4,500</span>
                    <span class="striked-val">₹5,200</span>
                </div>
                <div class="client-rating">4.9 ★ (110 ratings)</div>
                <a href="/crafts/woven-throw-blanket" class="view-btn">View</a>
            </div>
        </section>
        <section class="artisan-unit" data-item-id="ART-003">
            <div class="visual-wrap">
                <img src="/crafts/carved-bowl.jpg" alt="Artisan Bowl">
            </div>
            <div class="unit-body">
                <span class="product-title-text">Hand-carved Teak Wood Salad Bowl</span>
                <div class="pricing-tier">
                    <span class="active-val">₹2,950</span>
                </div>
                <div class="client-rating">4.6 ★ (42 ratings)</div>
                <a href="/crafts/teak-wood-salad-bowl" class="view-btn">View</a>
            </div>
        </section>
    </div>

</html>
